<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ShadowRoot 内嵌 iframe 测试</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  #host {
    display: block;
    border: 2px dashed #888;
    padding: 12px;
    margin-top: 16px;
  }
  h1 { font-size: 18px; }
</style>
</head>
<body>
  <h1>主页面（Light DOM）</h1>
  <p>下面这个虚线框是 Shadow Host，内部挂载了一个 ShadowRoot，ShadowRoot 内包含一个 iframe。</p>

  <!-- Shadow Host -->
  <div id="host"></div>

  <script>
    // 创建 open 模式的 shadow root，便于调试
    const host = document.getElementById('host');
    const shadow = host.attachShadow({ mode: 'open' });

    // 在 shadow root 中插入内容（含 iframe）
    shadow.innerHTML = `
      <style>
        :host { color: #333; }
        .label { font-weight: bold; color: #06c; }
        iframe {
          width: 100%;
          height: 240px;
          border: 1px solid #06c;
          margin-top: 8px;
        }
      </style>
      <div class="label">这里是 ShadowRoot 内部</div>
      <iframe id="inner-iframe"
              src="about:blank"
              title="shadow-iframe"></iframe>
    `;

    // 给 iframe 写入一些可见内容，方便观察
    const iframe = shadow.getElementById('inner-iframe');
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument;
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>inner</title></head>
          <body style="font-family:sans-serif;margin:12px;background:#f7f7ff;">
            <h2 style="font-size:16px;color:#06c;">我是 ShadowRoot 内的 iframe</h2>
            <p>location.href = <code id="loc"></code></p>
            <script>document.getElementById('loc').textContent = location.href;<\/script>
          </body></html>
        `);
        doc.close();
      } catch (e) {
        console.warn('写入 iframe 失败:', e);
      }
    });

    // 暴露到 window 方便在 DevTools 控制台访问
    window.__shadow = shadow;
    window.__iframe = iframe;
  </script>
</body>
</html>
